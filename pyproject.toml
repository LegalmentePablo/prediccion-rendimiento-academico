[project]
name = "prediccion-rendimiento-academico"
version = "1.0.0"
description = "Alerta temprana de pérdida de materias: estima qué estudiantes perderán el periodo 2 con lo que se sabe al cerrar el periodo 1."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "imbalanced-learn>=0.12",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
]

[project.scripts]
prediccion-rendimiento = "prediccion_rendimiento.cli:main"

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prediccion_rendimiento"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks/original"]  # archivo histórico, se conserva tal cual

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # textos en español con «», — y –

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
